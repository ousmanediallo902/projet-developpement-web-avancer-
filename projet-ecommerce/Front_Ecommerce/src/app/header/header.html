<!-- HEADER GLOBAL STICKY (toujours visible en haut lors du scroll) -->
<header class="w-full bg-white/80 backdrop-blur shadow-sm sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 lg:px-8 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <!-- Burger mobile -->
      <button (click)="openSidebar.emit()" class="md:hidden burger-btn mr-2 p-2 rounded hover:bg-sky-100 focus:outline-none" aria-label="Ouvrir le menu">
        <svg class="w-7 h-7 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <!-- Logo + nom plateforme -->
      <svg class="hidden md:inline-block w-7 h-7 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 21V9.75M21 21V9.75M3 9.75L12 3l9 6.75M3 9.75l9 6.75 9-6.75" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 21V12h6v9" />
      </svg>
      <span class="hidden md:inline-block text-md font-bold text-gray-900 tracking-tight">SenBoutique</span>
    </div>
    <div class="relative flex items-center gap-4">
      <!-- Email et rôle (desktop) -->
      <span class="hidden sm:inline text-gray-500 text-sm">{{ currentUser?.nom }}</span>
      <span class="hidden sm:inline-block bg-sky-100 text-sky-700 font-semibold px-3 py-1 rounded-full text-xs">{{ currentUser?.role }}</span>
      <!-- Avatar + Dropdown -->
      <button #avatarBtn (click)="$event.stopPropagation(); toggleDropdown.emit()" class="ml-2 focus:outline-none group relative" aria-label="Ouvrir le menu utilisateur">
        @if (user.photoUrl) {
          <img [src]="user.photoUrl" alt="Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-sky-200 shadow-sm" />
        } @else {
          <span class="w-10 h-10 flex items-center justify-center rounded-full bg-sky-600 text-white font-bold text-lg border-2 border-sky-200 shadow-sm">
            {{ getInitials() }}
          </span>
        }
      </button>
      @if (showDropdown) {
        <div #dropdownMenu class="absolute right-0 top-14 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-20 animate-fade-in">
          <div class="px-4 py-2 border-b border-gray-100 text-sm text-gray-700 font-semibold">{{ user.prenom }} {{ user.nom }}</div>
          <a href="#" class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-sky-50 text-sm transition">
            <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2a4 4 0 018 0v2"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            Mon profil
          </a>
          <a (click)="logout()" class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-sky-50 text-sm transition">
            <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/></svg>
            Déconnexion
          </a>
        </div>
      }
    </div>
  </div>
</header>

<!-- SIDEBAR ADMIN E-COMMERCE -->
<aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 shadow-md py-4 px-6 h-full sticky top-20 z-20">
  
  <!-- Logo / Titre -->
  <div class="flex items-center justify-center mb-8 px-4 py-3">
    <h2 class="text-xl font-bold text-gray-800">Admin Panel</h2>
  </div>

  <nav class="flex flex-col gap-2 mt-2">
    
    <!-- Dashboard -->
    <a routerLink="/admin/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-blue-50 font-medium transition text-sm">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Tableau de bord
    </a>

    <!-- Produits -->
    <a routerLink="/admin/produits" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-green-50 font-medium transition text-sm">
      <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
      </svg>
      Produits
    </a>

    <!-- Commandes -->
    <a routerLink="/admin/commandes" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
    class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-blue-50 font-medium transition text-sm">
  <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
  </svg>
  <span class="hidden md:block text-sm">Panier</span>
  @if (cartItemCount > 0) {
    <span class="bg-red-500 text-white text-xs rounded-full px-2 py-1 min-w-[20px] text-center">
      {{ cartItemCount }}
    </span>
  }
</a>

    <!-- Utilisateurs -->
    <a routerLink="/admin/utilisateurs" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: false}"
       class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-pink-50 font-medium transition text-sm">
      <svg class="w-5 h-5 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      Utilisateurs
    </a>

    <!-- Catégories -->
    <a routerLink="/admin/categories" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: false}"
       class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-yellow-50 font-medium transition text-sm">
      <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
      </svg>
      Catégories
    </a>

    <!-- Promotions -->
    <a routerLink="/admin/promotions" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: false}"
       class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-red-50 font-medium transition text-sm">
      <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      Promotions
    </a>

    <!-- Statistiques -->
    <a routerLink="/admin/statistiques" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: false}"
       class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-indigo-50 font-medium transition text-sm">
      <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      Statistiques
    </a>
    

     <!-- creation de produit -->
    <a routerLink="/admin/CrudProduit" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: false}"
       class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-pink-50 font-medium transition text-sm">
      <svg class="w-5 h-5 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      Ajout-produit
    </a>

    <!-- Retour boutique -->
    <div class="mt-8 pt-4 border-t border-gray-100">
      <a routerLink="/" 
         class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50 font-medium transition text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Retour à la boutique
      </a>
    </div>

  </nav>
</aside>

<!-- Mobile menu button (à placer dans le header) -->
<button class="md:hidden fixed bottom-4 right-4 z-50 bg-blue-600 text-white p-3 rounded-full shadow-lg">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
  </svg>
</button>

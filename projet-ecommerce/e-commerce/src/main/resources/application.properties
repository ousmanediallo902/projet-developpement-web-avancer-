spring.application.name=e-commerce

spring.datasource.url=jdbc:mysql://localhost:3306/gestion-ecommerce
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.open-in-view=false

# Chemin physique pour stocker les images (côté serveur)
upload.path=D:/projet/projet-ecommerce/e-commerce/uploads/

# Configuration pour servir les fichiers statiques
spring.web.resources.static-locations=classpath:/static/,file:${upload.path}
spring.mvc.static-path-pattern=/uploads/**

# Taille max des uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# SSL Configuration
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:server-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12

# mTLS - Authentification mutuelle
server.ssl.client-auth=none
server.ssl.trust-store=classpath:server-truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=PKCS12
